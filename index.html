<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Sangwoo Joh</title>

 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

 <!-- Tailwind CSS -->
 <script src="https://cdn.tailwindcss.com"></script>

 <script>
   tailwind.config = {
     darkMode: 'class',
     theme: {
     extend: {
     fontFamily: {
     sans: ['Inter', 'sans-serif'],
    },
     colors: {
     neutral: {
     900: '#111111',
     800: '#1a1a1a',
     700: '#262626',
     600: '#525252',
     500: '#737373',
     400: '#a3a3a3',
     300: '#d4d4d4',
     200: '#e5e5e5',
     100: '#f5f5f5',
     50: '#fafafa',
    }
    }
    }
    }
   }
 </script>

 <style>
   .card-hover {
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
   }
   .card-hover:hover {
    transform: translateY(-2px);
   }

   ::selection {
    background-color: #e5e5e5;
    color: #1a1a1a;
   }
   .dark ::selection {
    background-color: #404040;
    color: #f5f5f5;
   }
 </style>

 <script>
   if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
     document.documentElement.classList.add('dark');
   } else {
     document.documentElement.classList.remove('dark');
   }
 </script>
 </head>

 <body class="bg-fixed bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-neutral-50 via-white to-neutral-100 dark:from-neutral-800 dark:via-neutral-900 dark:to-black text-neutral-800 dark:text-neutral-200 antialiased min-h-screen flex flex-col items-center py-16 px-6 sm:px-12 transition-colors duration-300">

  <main class="w-full max-w-[540px] relative z-10">

   <!-- Toggle Buttons (Lang & Theme) -->
   <div class="flex justify-end items-center mb-8 w-full gap-2">
    <!-- Language Toggle Button -->
    <button id="lang-toggle" type="button" class="text-[13px] font-bold tracking-wider text-neutral-500 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800 focus:outline-none rounded-md px-3 py-2 transition-colors"></button>

   <!-- Theme Toggle Button -->
   <button id="theme-toggle" type="button" class="text-neutral-500 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800 focus:outline-none rounded-full text-sm p-2.5 transition-colors">
    <!-- Moon icon (shows in light mode) -->
    <img id="theme-toggle-dark-icon" class="hidden w-6 h-6 object-contain" src="https://img.icons8.com/doodle/48/bright-moon--v1.png" alt="bright-moon--v1"/>
   <!-- Sun icon (shows in dark mode, inverted for visibility) -->
   <img id="theme-toggle-light-icon" class="hidden w-6 h-6 object-contain" src="https://img.icons8.com/doodle/48/light-on--v1.png" alt="light-on--v1"/>
  </button>
  </div>

 <div class="flex flex-col items-start text-left mb-10">

  <!-- Need profile image -->
  <div class="w-24 h-24 mb-5 rounded-full overflow-hidden border border-neutral-200 dark:border-neutral-700 shadow-sm bg-neutral-100 dark:bg-neutral-800">
   <img src="./profile.jpg" alt="Sangwoo Joh" class="w-full h-full object-cover">
 </div>

 <h1 id="i18n-name" class="text-[26px] font-bold tracking-tight text-neutral-800 dark:text-neutral-100 mb-3"></h1>
 <p class="text-[14.5px] leading-relaxed text-neutral-600 dark:text-neutral-400 max-w-[600px]">
  <span id="i18n-desc1"></span><br>
 <span id="i18n-desc2"></span>
 </p>
 </div>

 <!-- Dashed Divider -->
 <div class="w-full my-10 opacity-70">
  <div class="w-full border-t border-dashed border-neutral-300 dark:border-neutral-700"></div>
 </div>

 <!-- Links & Navigation Cards -->
 <section id="links-container" class="w-full space-y-3 mb-16">
 </section>

 </main>

 <!-- Footer -->
 <footer class="mt-auto pb-8 text-center text-[12.5px] text-neutral-500 dark:text-neutral-400">
  <p>&copy; <span id="current-year"></span> Sangwoo Joh. All rights reserved.</p>
 <p class="mt-1">Icons by <a href="https://icons8.com/license" target="_blank" rel="noopener noreferrer" class="underline hover:text-neutral-800 dark:hover:text-neutral-200 transition-colors">Icons8</a></p>
 </footer>


 <script>
   // dynamic copyright year
   document.getElementById('current-year').textContent = new Date().getFullYear();

   // dark mode
   const themeToggleBtn = document.getElementById('theme-toggle');
   const darkIcon = document.getElementById('theme-toggle-dark-icon');
   const lightIcon = document.getElementById('theme-toggle-light-icon');

   if (document.documentElement.classList.contains('dark')) {
     lightIcon.classList.remove('hidden');
   } else {
     darkIcon.classList.remove('hidden');
   }

   themeToggleBtn.addEventListener('click', function() {
     darkIcon.classList.toggle('hidden');
     lightIcon.classList.toggle('hidden');

     if (document.documentElement.classList.contains('dark')) {
     document.documentElement.classList.remove('dark');
     localStorage.setItem('color-theme', 'light');
    } else {
     document.documentElement.classList.add('dark');
     localStorage.setItem('color-theme', 'dark');
   }
   });

   // i18n
   const i18nData = {
     en: {
     langBtn: "KR",
     profile: {
     name: "Sangwoo Joh",
     desc1: "Software engineer based in London, from Seoul.",
     desc2: "I enjoy understanding complex systems and solving problems. I also like listening to your stories."
    },
     links: {
     blog: { title: "Blog", subtitle: "Mostly in Korean" },
     github: { title: "GitHub", subtitle: "Some code" },
     linkedin: { title: "LinkedIn", subtitle: "Career" },
     cal: { title: "Book a meeting", subtitle: "Let's chat!" },
     coffee: { title: "Buy me a coffee", subtitle: "Support my work" },
     email: { title: "Email", subtitle: "Email me" }
    }
    },
     kr: {
     langBtn: "EN",
     profile: {
     name: "조상우",
     desc1: "소프트웨어 엔지니어.",
     desc2: "복잡한 시스템을 이해하고 문제 푸는 걸 좋아합니다. 이야기 듣는 것도 즐깁니다."
    },
     links: {
     blog: { title: "블로그", subtitle: "제 잡설을 모아둔 곳" },
     github: { title: "깃허브", subtitle: "코드" },
     linkedin: { title: "링크드인", subtitle: "커리어" },
     cal: { title: "약속 잡기", subtitle: "저랑 떠드실 분?" },
     coffee: { title: "커피 사주기", subtitle: "도네 받습니다" },
     email: { title: "이메일", subtitle: "메일 주세요" }
    }
    }
   };

   const linksConfig = [
     { id: "blog", url: "https://blog.untyped.kr", icon: `<img width="48" height="48" src="https://img.icons8.com/doodle/48/books.png" alt="books"/>` },
     { id: "github", url: "https://github.com/sangwoo-joh", icon: `<img width="48" height="48" src="https://img.icons8.com/doodle/48/github--v1.png" alt="github--v1"/>` },
     { id: "linkedin", url: "https://linkedin.com/in/sangwoo-joh", icon: `<img width="48" height="48" src="https://img.icons8.com/doodle/48/linkedin--v2.png" alt="linkedin--v2"/>` },
     { id: "cal", url: "https://cal.com/untyped/30min", icon: `<img width="48" height="48" src="https://img.icons8.com/doodle/48/timeline-week.png" alt="timeline-week"/>` },
     { id: "coffee", url: "https://buymeacoffee.com/untyped", icon: `<img width="48" height="48" src="https://img.icons8.com/doodle/48/cafe--v1.png" alt="cafe--v1"/>` },
     { id: "email", url: "mailto:work.sangwoo.joh@gmail.com", icon: `<img width="48" height="48" src="https://img.icons8.com/doodle/48/apple-mail.png" alt="apple-mail"/>` }
   ];

   let currentLang = localStorage.getItem('lang-pref') || 'en';

   function applyLanguage() {
     const data = i18nData[currentLang];
     document.getElementById('lang-toggle').textContent = data.langBtn;
     document.getElementById('i18n-name').textContent = data.profile.name;
     document.getElementById('i18n-desc1').textContent = data.profile.desc1;
     document.getElementById('i18n-desc2').textContent = data.profile.desc2;
     document.documentElement.lang = currentLang;
     renderLinks();
   }

   function renderLinks() {
     const linksContainer = document.getElementById('links-container');
     const langLinksData = i18nData[currentLang].links;

     linksContainer.innerHTML = linksConfig.map(link => {
     const targetAttr = link.url.startsWith('mailto:') ? '' : 'target="_blank" rel="noopener noreferrer"';
     const currentTitle = langLinksData[link.id].title;
     const currentSubtitle = langLinksData[link.id].subtitle;

     return `
                <a href="${link.url}" ${targetAttr} class="card-hover w-full flex items-center py-3 px-3.5 bg-white/60 dark:bg-neutral-800/40 backdrop-blur-md border border-neutral-200/80 dark:border-neutral-700/50 rounded-2xl shadow-sm hover:shadow-md dark:hover:bg-neutral-800/80 transition-all duration-200 group">
                    <div class="w-11 h-11 rounded-xl bg-neutral-100/80 dark:bg-neutral-900/80 flex items-center justify-center mr-3.5 shrink-0 shadow-inner overflow-hidden">
                        ${link.icon}
                    </div>
                    <div class="flex flex-row items-center justify-start gap-3">
                        <span class="text-[15.5px] font-bold text-neutral-800 dark:text-neutral-100 tracking-tight leading-none">${currentTitle}</span>
                        <div class="inline-flex items-center bg-neutral-100 dark:bg-neutral-700/50 px-2.5 py-1 rounded-xl rounded-tl-sm text-[13px] font-medium text-neutral-500 dark:text-neutral-400 border border-neutral-200/50 dark:border-neutral-600/50 w-fit shadow-[0_1px_2px_rgba(0,0,0,0.02)]">
                            ${currentSubtitle}
                        </div>
                    </div>
                    <div class="ml-auto"></div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-0 group-hover:opacity-100 transition-opacity text-neutral-400 group-hover:text-neutral-800 dark:group-hover:text-neutral-200 mr-2"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
                </a>
    `;
    }).join('');
   }

   document.getElementById('lang-toggle').addEventListener('click', () => {
     currentLang = currentLang === 'en' ? 'kr' : 'en';
     localStorage.setItem('lang-pref', currentLang);
     applyLanguage();
   });

   applyLanguage();
 </script>
 </body>
</html>
